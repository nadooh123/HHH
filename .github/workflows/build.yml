name: Build APK from Zip

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Extract Zip and Build
      run: |
        echo "Extracting zip file..."
        mkdir -p extracted_folder
        unzip -q "*.zip" -d extracted_folder

        GRADLEW_PATH=$(find extracted_folder -name "gradlew" -type f | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Error: gradlew not found!"
          exit 1
        fi

        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        echo "Found project at: $PROJECT_DIR"
        cd "$PROJECT_DIR"

        # التأكد من وجود gradle.properties وإضافة وضع التجاهل
        touch gradle.properties
        grep -q "kotlin.jvm.target.validation.mode" gradle.properties || echo "kotlin.jvm.target.validation.mode = IGNORE" >> gradle.properties

        # معالجة إعدادات المشروع الرئيسية
        BUILD_FILE=""
        if [ -f "build.gradle.kts" ]; then
          BUILD_FILE="build.gradle.kts"
        elif [ -f "build.gradle" ]; then
          BUILD_FILE="build.gradle"
        fi

        if [ "$BUILD_FILE" = "build.gradle.kts" ]; then
          echo "Patching build.gradle.kts with compilerOptions..."
          cat <<'EOF' >> build.gradle.kts

        import org.jetbrains.kotlin.gradle.dsl.JvmTarget

        subprojects {
            afterEvaluate {
                tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
                    compilerOptions {
                        jvmTarget.set(JvmTarget.JVM_17)
                    }
                }
            }
        }
        EOF
        elif [ "$BUILD_FILE" = "build.gradle" ]; then
          echo "Patching build.gradle with compilerOptions..."
          cat <<'EOF' >> build.gradle

        subprojects {
            afterEvaluate {
                tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                    compilerOptions {
                        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
                    }
                }
            }
        }
        EOF
        fi

        # تصحيح إضافات Android في settings.gradle.kts إذا لزم الأمر
        SETTINGS_FILE=""
        if [ -f "settings.gradle.kts" ]; then
          SETTINGS_FILE="settings.gradle.kts"
        elif [ -f "settings.gradle" ]; then
          SETTINGS_FILE="settings.gradle"
        fi

        if [ -n "$SETTINGS_FILE" ]; then
          if ! grep -q "pluginManagement" "$SETTINGS_FILE"; then
            cat <<'EOF' > /tmp/plugin_mgmt.txt
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        EOF
            cat /tmp/plugin_mgmt.txt "$SETTINGS_FILE" > /tmp/settings_temp && mv /tmp/settings_temp "$SETTINGS_FILE"
          fi
        fi

        chmod +x gradlew
        ./gradlew assembleDebug -Dkotlin.jvm.target.validation.mode=IGNORE

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/app-debug.apk"
