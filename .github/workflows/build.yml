name: Build APK from Zip

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Extract Zip and Fix Build Configs
      run: |
        echo "Extracting zip file..."
        mkdir -p extracted_folder
        unzip -q "*.zip" -d extracted_folder
        
        GRADLEW_PATH=$(find extracted_folder -name "gradlew" -type f | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Error: gradlew not found!"
          exit 1
        fi
        
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        echo "Found project at: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        # 1. إضافة الخاصية إلى gradle.properties كإجراء احتياطي (لتجاهل التحقق)
        echo "kotlin.jvm.target.validation.mode = IGNORE" >> gradle.properties
        
        # 2. إضافة بلوك subprojects إلى build.gradle الرئيسي لفرض الإصدار 17
        # هذا البلوك يضمن تطبيق الإعدادات على جميع المشاريع الفرعية والتبعيات
        cat <<'EOF' >> build.gradle
        subprojects {
            afterEvaluate { project ->
                if (project.hasProperty('android')) {
                    project.android {
                        compileOptions {
                            sourceCompatibility JavaVersion.VERSION_17
                            targetCompatibility JavaVersion.VERSION_17
                        }
                    }
                }
                if (project.hasProperty('kotlinOptions')) {
                    project.kotlinOptions.jvmTarget = "17"
                }
            }
        }
        EOF
        
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/app-debug.apk"
