name: Build APK from Zip

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Extract Zip and Build
      run: |
        echo "Extracting zip file..."
        mkdir -p extracted_folder
        unzip -q "*.zip" -d extracted_folder
        
        GRADLEW_PATH=$(find extracted_folder -name "gradlew" -type f | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Error: gradlew not found!"
          exit 1
        fi
        
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        echo "Found project at: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/app-debug.apk"
