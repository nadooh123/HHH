name: Build APK from Zip

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Extract Zip and Fix Build Configs
      run: |
        echo "Extracting zip file..."
        mkdir -p extracted_folder
        unzip -q "*.zip" -d extracted_folder
        
        GRADLEW_PATH=$(find extracted_folder -name "gradlew" -type f | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Error: gradlew not found!"
          exit 1
        fi
        
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        echo "Found project at: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        # --- معالجة ملف settings.gradle.kts بشكل آمن ---
        echo "Processing settings.gradle.kts safely..."
        SETTINGS_FILE="settings.gradle.kts"
        if [ ! -f "$SETTINGS_FILE" ]; then
          # إنشاء الملف إذا لم يكن موجوداً
          cat <<'EOF' > "$SETTINGS_FILE"
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "MyApp"
        include(":app")
        EOF
          echo "Created new $SETTINGS_FILE"
        else
          # التحقق مما إذا كان البلوك موجوداً
          if ! grep -q "pluginManagement" "$SETTINGS_FILE"; then
            echo "Adding pluginManagement block to the beginning of $SETTINGS_FILE"
            # استخدام ملف مؤقت لإدراج البلوك في البداية
            cat <<'EOF' > /tmp/plugin_management_block.txt
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        EOF
            cat /tmp/plugin_management_block.txt "$SETTINGS_FILE" > /tmp/settings_temp && mv /tmp/settings_temp "$SETTINGS_FILE"
          else
            echo "pluginManagement block already exists. Skipping addition."
          fi
        fi
        
        # --- إصلاح توافق JVM (لضمان عدم عودة الخطأ القديم) ---
        echo "Applying JVM target compatibility fix..."
        cat <<'EOF' >> build.gradle.kts
        subprojects {
            afterEvaluate { project ->
                if (project.hasProperty('android')) {
                    project.android {
                        compileOptions {
                            sourceCompatibility JavaVersion.VERSION_17
                            targetCompatibility JavaVersion.VERSION_17
                        }
                    }
                }
                tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
                    kotlinOptions {
                        jvmTarget = "17"
                    }
                }
            }
        }
        EOF
        
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/app-debug.apk"
