name: Build APK from Zip

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Extract Zip and Build
      run: |
        echo "Extracting zip file..."
        mkdir -p extracted_folder
        unzip -q "*.zip" -d extracted_folder
        
        GRADLEW_PATH=$(find extracted_folder -name "gradlew" -type f | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Error: gradlew not found!"
          exit 1
        fi
        
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        echo "Found project at: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        # --- بدء التعديل التلقائي على build.gradle ---
        echo "Applying fix for JVM target compatibility..."
        # إضافة الإعدادات إلى build.gradle الرئيسي
        cat <<'EOF' >> build.gradle

        // Fix for JVM target compatibility
        subprojects {
            afterEvaluate { project ->
                if (project.hasProperty('android')) {
                    project.android {
                        compileOptions {
                            sourceCompatibility JavaVersion.VERSION_17
                            targetCompatibility JavaVersion.VERSION_17
                        }
                    }
                }
                tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                    kotlinOptions {
                        jvmTarget = "17"
                    }
                }
            }
        }
        EOF
        
        # إضافة الخاصية إلى gradle.properties (كحل احتياطي)
        echo "kotlin.jvm.target.validation.mode = IGNORE" >> gradle.properties
        # --- انتهاء التعديل التلقائي ---
        
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/app-debug.apk"
