name: Build APK from Zip

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Extract Zip and Fix Build Configs
      run: |
        echo "Extracting zip file..."
        mkdir -p extracted_folder
        unzip -q "*.zip" -d extracted_folder
        
        GRADLEW_PATH=$(find extracted_folder -name "gradlew" -type f | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Error: gradlew not found!"
          exit 1
        fi
        
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        echo "Found project at: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        # --- بدء التعديل التلقائي على ملفات الإعدادات ---
        echo "Applying Android Plugin fix..."
        
        # 1. إنشاء أو تعديل ملف settings.gradle.kts لإضافة pluginManagement
        if [ -f "settings.gradle.kts" ]; then
          # إذا كان الملف موجوداً، نضيف إليه block الإعدادات
          sed -i '1i pluginManagement {\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n}' settings.gradle.kts
        elif [ -f "settings.gradle" ]; then
           # إذا كان الملف بصيغة Groovy
           sed -i '1i pluginManagement {\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n}' settings.gradle
        else
          # إذا لم يكن موجوداً، ننشئ ملف Kotlin DSL جديد
          cat <<'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "MyApp"
        include(":app")
        EOF
        fi

        # 2. إضافة إصدار الإضافة في ملف app/build.gradle.kts
        APP_BUILD_GRADLE="app/build.gradle.kts"
        if [ -f "$APP_BUILD_GRADLE" ]; then
          # البحث عن سطر الإضافة وإضافة الإصدار إذا لم يكن موجوداً
          sed -i 's/id("com.android.application")/id("com.android.application") version "8.7.0"/' "$APP_BUILD_GRADLE"
          sed -i 's/id("org.jetbrains.kotlin.android")/id("org.jetbrains.kotlin.android") version "1.9.0"/' "$APP_BUILD_GRADLE"
        fi
        
        # 3. تطبيق إصلاح توافق JVM (الذي أضفناه سابقاً)
        cat <<'EOF' >> build.gradle.kts
        subprojects {
            afterEvaluate { project ->
                if (project.hasProperty('android')) {
                    project.android {
                        compileOptions {
                            sourceCompatibility JavaVersion.VERSION_17
                            targetCompatibility JavaVersion.VERSION_17
                        }
                    }
                }
                tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
                    kotlinOptions {
                        jvmTarget = "17"
                    }
                }
            }
        }
        EOF
        # --- انتهاء التعديل التلقائي ---
        
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/app-debug.apk"
