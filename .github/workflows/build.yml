
name: Build APK from Zip

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # يسمح لك بتشغيله يدوياً من واجهة GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Extract Zip and Build
      run: |
        echo "Extracting zip file..."
        mkdir -p extracted_folder
        unzip -q "*.zip" -d extracted_folder
        
        # البحث عن مسار gradlew
        GRADLEW_PATH=$(find extracted_folder -name "gradlew" -type f | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Error: gradlew not found!"
          exit 1
        fi
        
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        echo "Found project at: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        # إنشاء ملف init.gradle لإجبار المشروع على استخدام إصدار 17 لـ Java و Kotlin
        echo "Creating init.gradle to fix JVM target compatibility..."
        cat <<EOF > init.gradle
        allprojects {
            tasks.withType(JavaCompile).configureEach {
                sourceCompatibility = '17'
                targetCompatibility = '17'
            }
            tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions.jvmTarget = '17'
            }
        }
        EOF
        
        chmod +x gradlew
        # تشغيل البناء باستخدام ملف init.gradle
        ./gradlew assembleDebug -I init.gradle

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/app-debug.apk"
